name: 'Tests'

on:
  workflow_dispatch:

jobs:
  tests:
    name: 'Test'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout project sources'
        uses: actions/checkout@v4

      - name: 'Setup Java 8'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: 'Run Maven verify phase'
        run: mvn --batch-mode --update-snapshots verify
